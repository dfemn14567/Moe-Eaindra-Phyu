<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Me App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div class="image-container">
      <img id="sticker" src="https://gifdb.com/images/high/cute-sad-cat-crying-emoji-0v965r4h1k0z4n9n.gif" alt="cute sticker">
    </div>

    <h2 id="text-prompt">စိတ်ဆိုးနေတုန်းလား? 💔</h2>

    <div class="buttons">
      <button id="yes-btn" onclick="handleYes()">YES 💖</button>
      <button id="no-btn" onclick="handleNo()">NO 💔</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
